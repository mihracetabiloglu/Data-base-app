<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kitap Listesi</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; padding: 20px; }
        .book-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; }
        .btn-borrow { background: #17a2b8; color: white; border: none; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Hoş Geldiniz</h2>
    <div id="books" class="book-list"></div>

    <script>
        async function loadBooks() {
            const response = await fetch('http://localhost:8080/api/books');
            const books = await response.json();
            document.getElementById('books').innerHTML = books.map(b => `
                <div class="card">
                    <h4>${b.title}</h4>
                    <p>Mevcut: ${b.available_copies}</p>
                    <button class="btn-borrow" onclick="borrow(${b.bookId})">Ödünç Al</button>
                </div>
            `).join("");
        }
        // KİTAP ÖDÜNÇ ALMA (POST İŞLEMİ)
    async function borrowBook(bookId) {
        // Backend'de userId parametresi de gerekiyordu
        // Şimdilik test için userId=1 diyelim, normalde login olan kullanıcının ID'si olmalı

                alert("Hata: " + errorMsg);

</body>
</html>
